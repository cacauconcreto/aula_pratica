<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Escolar - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="login-wrapper">
        <div class="login-container">
            <header class="login-header">
                <h2>Acesso ao Sistema</h2>
                <p class="login-subtitle">Bem-vindo! Digite seus dados para entrar no portal.</p>
            </header>

            <form id="loginForm" class="login-form">
                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" required placeholder="seu-email@escola.com" autocomplete="email">
                </div>
                
                <div class="input-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>

                <div class="input-group">
                    <label for="userType">Tipo de Usuário</label>
                    <div class="select-wrapper">
                        <select id="userType" required>
                            <option value="" disabled selected hidden>Selecione seu perfil...</option>
                            <option value="professor">Professor</option>
                            <option value="aluno">Aluno</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn-submit">Entrar no Sistema</button>
                
                <p id="errorMessage" class="error-msg" aria-live="polite"></p>
            </form>
        </div>
    </main>

    <script src="auth.js"></script>
</body>
</html>
